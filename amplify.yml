version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E 'GOOGLE_|NEXTAUTH_|MONGODB_|GEMINI_|CHAT_' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
